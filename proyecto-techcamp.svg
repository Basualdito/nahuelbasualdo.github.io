  <text x="426" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Interfaz Clara</text>
  <rect x="426" y="170" width="96" height="6" rx="3" fill="#facc15"/>

  <!-- Lista de tareas / flujo -->
