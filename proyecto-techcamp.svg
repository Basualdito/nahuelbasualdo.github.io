      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" rx="16" fill="url(#tcBg)"/>

  <!-- Tarjeta principal de App -->
