  <rect x="64" y="108" width="120" height="24" rx="6" fill="#1e3a5f"/>
  <rect x="64" y="144" width="104" height="16" rx="5" fill="#334155"/>
  <rect x="64" y="172" width="112" height="16" rx="5" fill="#334155"/>
